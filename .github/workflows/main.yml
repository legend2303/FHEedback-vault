name: Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run compile
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
  build-and-test-unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run compile
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
